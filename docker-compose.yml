services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica_dev
    command: ["postgres", "-c", "timezone=America/La_Paz"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d clinica"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: clinica
      DB_USER: clinica
      DB_PASSWORD: clinica_dev
      APP_ENV: development
      APP_TZ: America/La_Paz
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
